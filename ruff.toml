target-version = "py312"
line-length = 100

[lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]
ignore = [
    "E402",  # import not at top (langfuse try/except pattern)
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name (single-letter vars in comprehensions)
    "SIM105", # contextlib.suppress (try/except/pass is clearer for imports)
    "SIM108", # ternary operator (readability preference)
    "SIM102", # collapsible if (readability preference)
    "SIM113", # enumerate instead of manual counter
    "SIM115", # use context manager for open()
    "SIM117", # multiple with statements (readability preference)
    "TCH001", # move first-party import into TYPE_CHECKING (too invasive)
    "TCH003", # move stdlib import into TYPE_CHECKING (breaks runtime in tests)
    "B017",   # pytest.raises(Exception) too broad (existing test patterns)
    "B018",   # useless expression (existing patterns)
    "B023",   # function variable not used in loop body
    "F821",   # undefined name (lazy imports with future annotations)
]

[lint.isort]
known-first-party = ["agents", "shared", "logos"]

[format]
quote-style = "double"
# Markdown is NOT ours to format. Ruff promoted markdown formatting out of preview in 0.16, and
# because .github/workflows/ci.yml pinned the ruff ACTION by SHA while passing no `version:` — the
# state BEFORE this change; the same commit adds `version: "0.16.1"` to both steps — CI silently
# picked up the new behaviour. ~24 docs that nobody had touched went red overnight, `lint` failed,
# `all-green` failed with it, and since `all-green` is a REQUIRED check the entire merge queue
# jammed: hapax-council merged nothing between 2026-07-11 and 2026-08-03 while 75 PRs accumulated.
# Bisected on files byte-identical to origin/main:
#   ruff 0.15.3 -> "Markdown formatting is experimental, enable preview mode."
#   ruff 0.16.1 -> "2 files would be reformatted"
# Excluding markdown restores the intended scope of this config. Reformatting the docs instead would
# rewrite files touched by an unknown share of those 75 open PRs and manufacture conflicts across
# the whole queue, to satisfy a check this repo never meant to apply to prose.
exclude = ["*.md"]

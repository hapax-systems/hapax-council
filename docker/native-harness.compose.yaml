# Isolated native-loading measurement shapes. These are not newly admitted
# production routes. Actual worker admission stays at the existing adapter.
# IMAGE variables must identify the tested images by sha256 image ID or digest.
services:
  claude:
    image: ${CLAUDE_IMAGE:?set the tested immutable Claude image reference}
    user: "1000:1000"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /opt/hapax-agent/.cache:uid=1000,gid=1000
    volumes:
      - ${NATIVE_PROJECT:?set an isolated project}:/work:ro
      - ${CLAUDE_STATE:?set this session's owned state}:/opt/hapax-agent/.claude/projects
    command: [--version]
  codex:
    image: ${CODEX_IMAGE:?set the tested immutable Codex image reference}
    user: "1000:1000"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /opt/hapax-agent/.cache:uid=1000,gid=1000
      - /opt/hapax-agent/.codex/skills:uid=1000,gid=1000
    volumes:
      - ${NATIVE_PROJECT:?set an isolated project}:/work:ro
      - ${CODEX_STATE:?set this session's owned state}:/state
      - ${CODEX_STATE:?set this session's owned state}/sessions:/opt/hapax-agent/.codex/sessions
    command: [--version]

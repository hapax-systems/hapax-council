# THE LAUNCHERS ARE NOT THE ONLY CALLER. scripts/codex-frontier-selection.sh unified the
# frontier pair across the two governed launchers, but this file is installed verbatim to
# ~/.codex/config.toml by scripts/install-codex-config.sh and is what every AD-HOC `codex` /
# `codex exec` invocation reads — the 29-of-33 population that measurably bypasses the
# launchers entirely. While it said gpt-5.5/xhigh, running the installer REGRESSED a live
# host off the frontier, silently and without a stated reason, which is the exact act the
# selection guard exists to refuse. Kept equal to the builtins in
# scripts/codex-frontier-selection.sh; tests/test_codex_frontier_declaration_parity.py fails
# if the two drift.
model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[projects."__HAPAX_PROJECTS__"]
trust_level = "trusted"

[projects."__HAPAX_COUNCIL_DIR__"]
trust_level = "trusted"

[mcp_servers.hapax]
command = "__HAPAX_HOME__/.local/bin/uv"
args = ["--directory", "__HAPAX_MCP_DIR__", "run", "hapax-mcp"]

[mcp_servers.hapax.env]
LOGOS_BASE_URL = "http://localhost:8051/api"

[mcp_servers.context7]
command = "__HAPAX_COUNCIL_DIR__/scripts/hapax-context7-mcp"

[mcp_servers.playwright]
command = "__HAPAX_COUNCIL_DIR__/scripts/hapax-playwright-mcp"

[mcp_servers.github]
command = "__HAPAX_COUNCIL_DIR__/scripts/hapax-github-mcp"

[mcp_servers.tavily]
command = "__HAPAX_COUNCIL_DIR__/scripts/hapax-tavily-mcp"

[hooks]
SessionStart = [
  { command = "__HAPAX_COUNCIL_DIR__/hooks/scripts/codex-hook-adapter.sh", timeout = 20, statusMessage = "Loading Hapax context" },
]
PreToolUse = [
  { command = "__HAPAX_COUNCIL_DIR__/hooks/scripts/codex-hook-adapter.sh", timeout = 20, include_apply_patch_tool = true, statusMessage = "Hapax guardrails" },
]
PostToolUse = [
  { command = "__HAPAX_COUNCIL_DIR__/hooks/scripts/codex-hook-adapter.sh", timeout = 20, include_apply_patch_tool = true, statusMessage = "Hapax audit" },
]
Stop = [
  { command = "__HAPAX_COUNCIL_DIR__/hooks/scripts/codex-hook-adapter.sh", timeout = 20, statusMessage = "Writing Hapax session summary" },
]

[tui.model_availability_nux]
"gpt-5.5" = 1

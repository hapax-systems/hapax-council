[Service]
# Keep the user manager killable while bounding the complete UID tree on appendix.
# Same derived ceiling as user-1000.slice.conf: uid_high 38G / uid_max 46G from the measured
# 60.38 GiB MemTotal, so the manager's ceiling binds before the host runs out of RAM.
OOMScoreAdjust=100
OOMPolicy=continue
MemoryHigh=38G
MemoryMax=46G
MemorySwapMax=8G
MemoryLow=20G
MemoryMin=10G

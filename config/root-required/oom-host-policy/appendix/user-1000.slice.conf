[Slice]
# Appendix UID-tree ceiling, including user@1000.service and session scopes.
# Derived, not copied: uid_max = 60G MemTotal - system.slice MemoryMin 12G - 2G kernel margin
# = 46G, uid_high = uid_max - 8G = 38G. Lanes are throttled at uid_high; uid_max is the kernel's
# whole-UID backstop, and both sit below MemTotal so system.slice's own floor stays satisfiable.
# This ceiling covers the operator's desktop session as well as the lanes, so the session is kept
# safe by floors rather than by a raised ceiling: session.slice keeps its own child floor inside
# user.slice, and the six interactive units (pipewire, pipewire-pulse, wireplumber,
# studio-compositor, hapax-daimonion, hapax-imagination) carry MemoryLow/MemoryMin with
# OOMScoreAdjust=100 drop-ins - so reclaim and the OOM killer take the unfloored lanes first.
MemoryHigh=38G
MemoryMax=46G
MemorySwapMax=8G
MemoryLow=20G
MemoryMin=10G

# Hapax lane tmux profile.
#
# This profile is sourced by the Hapax tmux-backed lane launchers. It is
# intentionally narrow: make mouse/copy-mode selection in lane panes reach the
# terminal clipboard via tmux's native OSC 52 path, especially foot on KDE
# Wayland, without changing the prefix or operator workflow.

set -g @hapax_lane_clipboard_profile_loaded 1

set -g mouse on
set -g set-clipboard on
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g default-terminal "tmux-256color"
setw -g mode-keys vi

set -as terminal-features ",foot*:clipboard:RGB"
set -as terminal-features ",xterm*:clipboard:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -ga terminal-overrides ",foot*:Tc,foot*:Ms=\\E]52;c;%p2%s\\007"
set -ga terminal-overrides ",xterm*:Tc,xterm*:Ms=\\E]52;c;%p2%s\\007"
set -ga terminal-overrides ",tmux-256color:Tc"

bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode M-w send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-w send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-selection-and-cancel }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-selection-and-cancel }

# PR review-team lens registry — strategic constitution, tactical sizing,
# cross-family independence.
#
# Spec (ratified): ~/Documents/Personal/30-areas/hapax/pr-review-team-design-2026-06-11.md
# Consumers: scripts/review_team.py (selection/constitution/gate),
#            scripts/cc-pr-review-dispatch.py (dispatcher).
# Charters: every lens listed here MUST have config/review-lenses/<lens>.md
#           (pinned by tests/test_review_team.py).
registry_schema: 1
registry_id: review-lenses
declared_at: "2026-06-11T00:00:00Z"

# Three repeats per size on one merged PR, with three planted defects: this is a
# dispatch boundary for that demand, not a universal quality guarantee. Claude
# scored 6/9 at 160 KB (one parser-invalid reply) but 9/9 at 320 KB; the
# preregistered largest-eligible rule is non-monotonic for that cell.
# Evidence: vault 30-areas/hapax/lanebus/review-capacity/measurement-final.json.
# Prompt ceilings are the rendered prompt bytes at each seat's measured diff limit;
# see prompt-manifest.json and prompt-manifest-supplement.json under that directory.
diff_capacity:
  default:
    limit_bytes: 80000
    prompt_limit_bytes: 70199  # Smallest successful measured prompt (glm 40 KB).
    status: unmeasured
    measurement_file: 30-areas/hapax/lanebus/review-capacity/measurement-final.json
    measurement_sha256: fdf13ffcb457c8d0ee6414e0310e4244adac63aea10d47c8b217da69c782fd8d  # pragma: allowlist secret
  # Seat entries inherit the report path and hash from default.
  seats:
    claude-1:
      limit_bytes: 319965
      prompt_limit_bytes: 391347
      status: measured
    codex-1:
      limit_bytes: 319965
      prompt_limit_bytes: 391345
      status: measured
    gemini-1:
      limit_bytes: 39974
      prompt_limit_bytes: 70205
      status: measured
    glm-1:
      limit_bytes: 39974
      prompt_limit_bytes: 70199
      status: measured
    muse-1:
      limit_bytes: 61494
      prompt_limit_bytes: 95534
      status: measured
    # Vibe's 22 KB wrapper refused even the 40 KB fixture before inference.
    vibe-1:
      limit_bytes: 80000
      prompt_limit_bytes: 22000  # Wrapper refusal ceiling; no successful 40 KB run.
      status: unmeasured
    # The entitlement substitute seats (kimi-1, featherless-1, verboo-1) inherit the default
    # unmeasured 80000/70199; each wrapper enforces its own prompt ceiling (featherless's
    # DeepSeek-V4-Pro 32k is a known mismatch for long packets), and a real per-seat capacity
    # sweep is a follow-up (review-substitute-families-kimi-featherless-verboo-20261003).

# Always-on lenses are the floor, not the ceiling — every PR, every team.
always_on_lenses:
  - tests-cover-the-diff
  - exit-predicate-adequacy
  - doc-claims-recheck

# Surface -> mandatory lenses (spec §1). Globs match changed-file paths
# (repo-relative, POSIX). "dir/**" is a prefix match; everything else is
# fnmatch (so "*.md" matches at any depth and "*mcp*" is a substring match).
surface_lenses:
  - surface: daimonion
    globs: ["agents/hapax_daimonion/**"]
    lenses: [correctness, live-runtime-composition, voice-doctrine]
  - surface: governance
    globs:
      - "shared/governance/**"
      - "axioms/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - "config/agent-instructions/native/*.md"
      - "config/agent-instructions/bindings.json"
      - "docs/runbooks/council-domain-context.md"
      - "scripts/install-agent-instructions.py"
    lenses: [axiom-compliance, formal-soundness, consent-provenance]
  - surface: audio
    globs: ["config/pipewire/**", "config/audio-*", "scripts/*audio*"]
    lenses: [audio-protected-invariants, audio-routing-witness, audio-levels-doctrine]
  - surface: deploy
    globs: ["systemd/**", "scripts/*deploy*"]
    lenses: [wire-contract, deploy-drift, canonical-root]
  - surface: sdlc
    globs: ["scripts/cc-*", "scripts/review_team.py", "shared/sdlc_lifecycle.py", "shared/release_gate.py", "config/review-lenses/**"]
    lenses: [sdlc-legibility, sdlc-gate-compose]
  - surface: trust-boundary
    globs: ["*mcp*", "*oauth*", "*egress*", "*publish*"]
    lenses: [security, silent-failure-hunting]

# Applied when EVERY changed file lives under tests/** (spec §1 row 6).
tests_only_lenses: [test-validity, anti-theater]

# Tactical sizing (spec §2). quorum_accept counts accept/accept-with-findings
# verdicts; any unresolved named critical blocks regardless of quorum.
sizing:
  t3_docs:
    team_size: 2
    quorum_accept: 2
    min_families: 2
    block_on_named_critical: true
  t2_standard:
    team_size: 3
    quorum_accept: 2
    min_families: 2
    block_on_named_critical: true
  t1_critical:
    team_size_min: 4
    team_size_max: 5
    quorum_accept: 3
    require_all_families: true
    criticals_must_resolve: true
    block_on_named_critical: true

# Changed-file surfaces that force t1_critical regardless of task risk_tier
# (governance / deploy-path / segment-critical, spec §2 row 3).
t1_surface_globs:
  - "shared/governance/**"
  - "axioms/**"
  - "AGENTS.md"
  - "**/AGENTS.md"
  - "CLAUDE.md"
  - "**/CLAUDE.md"
  - "config/agent-instructions/native/*.md"
  - "config/agent-instructions/bindings.json"
  - "docs/runbooks/council-domain-context.md"
  - "scripts/install-agent-instructions.py"
  - "config/pipewire/**"
  - "systemd/**"
  - "scripts/*deploy*"
  - ".github/**"
  - "hooks/**"
  - "scripts/review_team.py"
  - "config/review-lenses/**"
  - "docs/architecture/system-dynamics-map*"
  - "docs/architecture/vendor/cytoscape-*.js"

# A diff is docs-only (t3_docs candidate) when every changed file matches.
docs_only_globs: ["docs/**", "*.md"]

# Model-family roster (spec §3). reviewer_command is an argv prefix; the
# blind reviewer prompt is piped on stdin. Tune flags here, not in code.
families:
  - family: claude
    # scripts/hapax-claude-reviewer pins Opus, disables tools, and injects the
    # bare-fence output contract. Keeping this as a wrapper, not a raw
    # ``claude -p`` argv, lets the platform-capability route represent this as
    # read-only review capacity rather than a mutable Claude worker lane.
    reviewer_command: ["scripts/hapax-claude-reviewer"]
    timeout_seconds: 1200
  - family: codex
    reviewer_command: ["codex", "exec", "--sandbox", "read-only", "-"]
    timeout_seconds: 1200
  - family: gemini
    reviewer_command: ["scripts/hapax-agy-reviewer"]
    timeout_seconds: 1200
  - family: glm
    # Emergency outage procedure: GLM degrades out of a constitution only with
    # a fresh family-outage witness in
    # ~/.cache/hapax/review-team/family-outage.json, normally written when the
    # seat returns quota-wall/provider-outage. For a hard GLM adapter/pass/
    # provider failure outside those classifiers, open a governed incident
    # note, seed {"glm": "<current ISO timestamp>"} in that witness file, and
    # rerun dispatch; admission enforces the same FAMILY_OUTAGE_TTL_S expiry.
    # Recheck witness: python -c 'import json,pathlib; p=pathlib.Path.home()/".cache/hapax/review-team/family-outage.json"; print(json.loads(p.read_text()).get("glm"))'
    # Broad emergency stops remain HAPAX_REVIEW_TEAM_DISPATCH_OFF=1
    # (stop writing dossiers) and HAPAX_REVIEW_TEAM_GATE_OFF=1 (admission
    # bypass only under operator/governance authority).
    reviewer_command: ["scripts/hapax-glmcp-reviewer"]
    timeout_seconds: 1200
  # Substitute families (review-constitution-walled-family-substitution-20260924, option (a),
  # granted by the coordinator seat 2026-09-24T21:17:12Z). ``substitute: true`` means the
  # family fills only seats the core families above cannot fill with distinct families. It is
  # never part of t1's every-family requirement, and it never displaces a core family. These
  # are static (no route_id), like codex. The quota readers in shared/quota_headroom.py
  # (muse / vibe rows) still exclude a walled one. Route-backed seats with runtime receipts
  # are a follow-up row. Substitutes are seated in the order listed here, most reliable first.
  - family: muse
    # Meta Muse via `muse exec`. Measured reliable up to 96 KB prompts (2026-09-24 panels).
    reviewer_command: ["scripts/hapax-muse-reviewer"]
    timeout_seconds: 1200
    substitute: true
  - family: local
    # Local fleet: qwen3.8-flash-next on the spark-01df vLLM cluster, $0. Reliable, but twice
    # (2026-09-24) its verdict line contradicted its own text; synthesize_dossier escalates
    # verdict-contradicts-findings and a named critical blocks whatever the verdict says.
    reviewer_command: ["scripts/hapax-local-reviewer"]
    timeout_seconds: 1200
    substitute: true
  - family: vibe
    # Mistral Medium 3.5 via `vibe -p`. It returned 0 B three times on 45-87 KB prompts and
    # returned verdicts at 22 KB and 60 KB, so the wrapper refuses prompts above its ceiling.
    reviewer_command: ["scripts/hapax-vibe-reviewer"]
    timeout_seconds: 1200
    substitute: true
  # Entitlement substitute families (review-substitute-families-kimi-featherless-verboo-20261003;
  # operator 2026-10-03 "stop relying purely on codex and claude code ... do not discount any
  # entitlement access"). Each is a subscription/prepaid/flat seat read through the FileStore,
  # never a PAYG key, with an HTTP wrapper following muse/local (blind stdin prompt, tools off,
  # bare-fence contract, prompt ceiling, served model recorded, 429->quota / 5xx->provider-outage
  # mapping). Anti-inflation: a substitute counts as its served model's family where that is a
  # core/seated family (scripts/hapax_review_family_inflation.py), so each pins a distinct,
  # non-duplicate model (not GLM, not the local Qwen, not Mistral; Kimi is its own family).
  - family: kimi
    # Kimi Code subscription, Anthropic /v1/messages at api.kimi.com/coding (FileStore
    # kimi-api-key). The wrapper refuses any non-coding base so the call cannot bill the Moonshot
    # booster/PAYG wallet.
    reviewer_command: ["scripts/hapax-kimi-reviewer"]
    timeout_seconds: 1200
    substitute: true
    pinned_model: kimi-for-coding
  - family: featherless
    # Featherless prepaid $200/mo flat (FileStore featherless-api-key), OpenAI /chat/completions.
    # Pins DeepSeek-V4-Pro (distinct deepseek family); its 32k context is a known mismatch for
    # long packets, so the wrapper refuses oversized prompts and the constitution substitutes.
    reviewer_command: ["scripts/hapax-featherless-reviewer"]
    timeout_seconds: 1200
    substitute: true
    pinned_model: deepseek-ai/DeepSeek-V4-Pro
  - family: verboo
    # Verboo flat plan (FileStore verboo-api-key), OpenAI-compatible router at
    # code.verboo.ai/router/v1, streamed only with retry-free failure classification. Verboo is a
    # router (deepseek / glm / minimax / qwen / ...); pinned to minimax-m3 so it is a DISTINCT
    # family from featherless (deepseek) and the core glm. The wrapper records the served model so
    # the anti-inflation mapping verifies the family.
    reviewer_command: ["scripts/hapax-verboo-reviewer"]
    timeout_seconds: 1200
    substitute: true
    pinned_model: minimax-m3

# Optional route-backed review-seat descriptors. These extend the roster only
# when the named platform-capability route is admitted with fresh route,
# resource, quota, and provider-doc receipts and the reviewer command starts
# with that route's sanctioned_wrapper. Leave empty until a route has explicit
# review-seat metadata; worker/local/boutique routes are not inferred.
route_backed_review_families:
  - family: claude
    # Fail-closed binding: Claude review supply counts only when the
    # claude.review.opus platform route is admitted with fresh platform and
    # route-specific subscription/quota receipts. The wrapper pins Opus and
    # denies tools so this route is distinct from mutable Claude headless lanes.
    route_id: claude.review.opus
    reviewer_command: ["scripts/hapax-claude-reviewer"]
    timeout_seconds: 1200
  - family: gemini
    # Fail-closed binding: this family is backed by the agy reviewer wrapper,
    # but the route_id is not live-capacity evidence by itself. The review-team
    # gate seats gemini only when the platform-capability registry admits
    # agy.review.direct with fresh route/resource/quota receipts; otherwise the
    # family is degraded as blocked supply. scripts/hapax-agy-reviewer pins the
    # review model to gemini-3.1-pro-preview so ambient agy model settings cannot
    # silently change the family counted by the dossier.
    route_id: agy.review.direct
    reviewer_command: ["scripts/hapax-agy-reviewer"]
    timeout_seconds: 1200
  - family: glm
    # Fail-closed binding: GLM review supply counts only when the
    # platform-capability registry admits glmcp.review.direct with fresh
    # route/resource/quota receipts. A blocked or stale route degrades out
    # rather than silently becoming review capacity.
    route_id: glmcp.review.direct
    reviewer_command: ["scripts/hapax-glmcp-reviewer"]
    timeout_seconds: 1200

# Authoring-lane -> model family (writer's family never holds the majority
# alone). vbe- lanes never author on off-limits surfaces (per CLAUDE.md); the
# vibe family reviews only as a read-only substitute seat (see families above).
# agy.review.direct is a read-only review route, not an authoring lane; agy
# and retired Antigrav lane names fail closed here instead of mapping to Gemini.
lane_families:
  exact:
    alpha: claude
    beta: claude
    gamma: claude
    delta: claude
    epsilon: claude
    zeta: claude
    eta: claude
    theta: claude
    cx-glmcp: glm
    codex-glmcp: glm
    glmcp: glm
  prefixes:
    cx-: codex
    codex-: codex
    glm-: glm
    vbe-: vibe
  retired:
    - iota
    - agy
    - antigrav
    - antigravity
    - gemini-cli
  retired_prefixes:
    - agy-
    - antigrav-
    - antigravity-
    - gemini-cli-
  default: claude

name: Review refutation proof
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact reviewed PR head (dispatch on that branch)
        required: true
      mutation_sha:
        description: Source-only mutant commit in this repository
        required: true
      test_ids:
        description: JSON array of exact proving pytest node IDs
        required: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LITELLM_BASE_URL: http://0.0.0.0:1 # pragma: allowlist secret — inert CI endpoint
      QDRANT_URL: http://0.0.0.0:1 # pragma: allowlist secret — inert CI endpoint
      OLLAMA_HOST: http://0.0.0.0:1 # pragma: allowlist secret — inert CI endpoint
      LANGFUSE_HOST: http://0.0.0.0:1 # pragma: allowlist secret — inert CI endpoint
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Observe named tests and exact restoration
        env:
          PROOF_HEAD: ${{ inputs.head_sha }}
          PROOF_MUTATION: ${{ inputs.mutation_sha }}
          PROOF_TESTS: ${{ inputs.test_ids }}
        run: |
          test "$GITHUB_SHA" = "$PROOF_HEAD"
          uv run --frozen python scripts/review_refutation_proof.py \
            --head "$PROOF_HEAD" --mutation "$PROOF_MUTATION" \
            --tests-json "$PROOF_TESTS" --output "$RUNNER_TEMP/proof.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-refutation-proof
          path: ${{ runner.temp }}/proof.json
          if-no-files-found: error

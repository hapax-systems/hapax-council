name: Security Extras

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-extras-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # This job ran `docker://rhysd/actionlint:1.7.12` until 2026-08-08. The repo
      # sets `sha_pinning_required: true`, and a `:tag` docker reference is not a
      # pinned reference, so every run since 2026-06-25 died as `startup_failure`
      # — which files no check-run, so `all-green` never observed the outage and
      # workflow-file lint went unenforced for 44 days. Digest-pinning the image
      # would trade one startup failure for another: the allowlist entry is
      # `docker://rhysd/actionlint:*`, which a `@sha256:` reference does not match.
      # A checksum-verified binary in a `run:` step is subject to neither the
      # pinning policy nor the allowlist, so this job can no longer be killed by a
      # settings change made elsewhere.
      - name: Install actionlint (checksum-pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"
      - name: Run actionlint
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color

  rust-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24
        with:
          denyWarnings: false
          createIssues: false

  scorecard:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          sarif_file: results.sarif

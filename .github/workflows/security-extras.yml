name: Security Extras

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-extras-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # This job ran `docker://rhysd/actionlint:1.7.12` until 2026-08-08. The repo
      # sets `sha_pinning_required: true`, and a `:tag` docker reference is not a
      # pinned reference, so every run since 2026-06-25 died as `startup_failure`
      # — which files no check-run, so `all-green` never observed the outage and
      # workflow-file lint went unenforced for 44 days. Digest-pinning the image
      # would trade one startup failure for another: the allowlist entry is
      # `docker://rhysd/actionlint:*`, which a `@sha256:` reference does not match.
      # A checksum-verified binary in a `run:` step is subject to neither the
      # pinning policy nor the allowlist, so this job can no longer be killed by a
      # settings change made elsewhere.
      # ACTIONLINT_SHA256 is the sole integrity control on a binary fetched from
      # the network and then executed in CI, so its provenance and refresh
      # procedure belong next to the value rather than in a commit message.
      # Source: the `actionlint_<version>_checksums.txt` asset on the upstream
      # release. To bump the version, replace both values together and verify:
      #   v=1.7.13  # the new version
      #   curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_checksums.txt"
      #   grep "actionlint_${v}_linux_amd64.tar.gz" "actionlint_${v}_checksums.txt"
      # The digest printed there is what ACTIONLINT_SHA256 must equal. A bump
      # that changes the version without the checksum fails `sha256sum -c` and
      # stops the job, which is the intended behaviour.
      - name: Install actionlint (checksum-pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"
      - name: Run actionlint
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint" -color

  rust-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24
        with:
          denyWarnings: false
          createIssues: false

  scorecard:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: results.sarif

name: Agentic Trust Package

on:
  push:
    branches: [main]
    paths:
      - "packages/hapax-agentic-trust/**"
      - ".github/workflows/agentic-trust-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/hapax-agentic-trust/**"
      - ".github/workflows/agentic-trust-package.yml"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: agentic-trust-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hapax-agentic-trust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-dependency-glob: packages/hapax-agentic-trust/uv.lock
          version: 0.11.15
          python-version: "3.12"
      - name: Sync standalone verifier environment
        run: uv sync --frozen --extra dev
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test standalone verifier
        run: uv run pytest -q
      - name: Build reproducible wheel and source distribution twice
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --offline --sdist --wheel --out-dir dist-a
          uv build --offline --sdist --wheel --out-dir dist-b
          cmp dist-a/hapax_agentic_trust-0.1.0-py3-none-any.whl \
              dist-b/hapax_agentic_trust-0.1.0-py3-none-any.whl
          cmp dist-a/hapax_agentic_trust-0.1.0.tar.gz \
              dist-b/hapax_agentic_trust-0.1.0.tar.gz
      - name: Verify distribution contents
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist-a").glob("*.whl"))
          sdist = next(Path("dist-a").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required_wheel = {
              "hapax_agentic_trust/PROVENANCE.md",
              "hapax_agentic_trust/PROVENANCE.json",
              "hapax_agentic_trust/py.typed",
              "hapax_agentic_trust/provenance/golden-terminal-v3.sha256",
              "hapax_agentic_trust/provenance/package-payload-v1.sha256",
              "hapax_agentic_trust/schemas/agentic-trust-evidence-receipt-v1.schema.json",
          }
          missing = required_wheel - names
          if missing:
              raise SystemExit(f"wheel missing required evidence resources: {sorted(missing)}")
          if any("/tests/" in name for name in names):
              raise SystemExit("wheel unexpectedly contains tests")
          with tarfile.open(sdist, "r:gz") as archive:
              source_names = set(archive.getnames())
          for suffix in (
              "/PROVENANCE.md",
              "/PROVENANCE.json",
              "/uv.lock",
              "/provenance/golden-terminal-v3.sha256",
              "/provenance/package-payload-v1.sha256",
              "/provenance/recovery-inputs-v1/src/conservatory/terminal_bundle.py.source.txt",
              "/schemas/agentic-trust-evidence-receipt-v1.schema.json",
              "/tests/test_verifier.py",
              "/tests/test_provenance.py",
              "/tests/fixtures/golden-terminal-v3/anchors.json",
          ):
              if not any(name.endswith(suffix) for name in source_names):
                  raise SystemExit(f"sdist missing reproducibility resource: {suffix}")
          PY
      - name: Install and smoke-test the built wheel
        run: |
          uv venv --python 3.12 .wheel-smoke
          uv pip install --offline --python .wheel-smoke/bin/python \
            dist-a/hapax_agentic_trust-0.1.0-py3-none-any.whl
          .wheel-smoke/bin/python - <<'PY'
          import json
          from importlib.resources import files

          import hapax_agentic_trust

          root = files("hapax_agentic_trust")
          schema = json.loads(
              root.joinpath("schemas/agentic-trust-evidence-receipt-v1.schema.json")
              .read_text(encoding="utf-8")
          )
          provenance = json.loads(root.joinpath("PROVENANCE.json").read_text(encoding="utf-8"))
          assert schema["properties"]["chronology_status"]["const"] == "not_verified"
          assert provenance["scope"]["may_authorize_external_action"] is False
          assert hapax_agentic_trust.verify_terminal_projection
          PY

# Source for the seat owed-set refresh on the existing 15-minute sweep.
# Interim live copy, hand-installed 2026-09-25T03:07Z (22:07 local):
# ~/.config/systemd/user/lanebus-staleness-sweep.service.d/seat-owed-set.conf
# Replaced by the deployed copy of this file on merge. The command is the
# ~/.local/bin symlink, which then points at the release tree.
[Service]
# The leading '-' keeps a projection failure from failing the sweep.
# SessionStart only reads the file this command writes.
ExecStart=-%h/.local/bin/hapax-seat-owed-set --refresh-cache

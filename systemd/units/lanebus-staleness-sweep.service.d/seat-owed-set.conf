# Refresh the seat owed set on the existing 15-minute sweep.
# Runs from the activation worktree, which deploy points at the release
# tree on merge. A failed refresh is visible: there is no leading '-'.
# The base unit is Type=oneshot, so this second ExecStart is valid.
[Service]
ExecStart=%h/.cache/hapax/source-activation/worktree/.venv/bin/python %h/.cache/hapax/source-activation/worktree/scripts/hapax-seat-owed-set --refresh-cache

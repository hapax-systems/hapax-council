id: backup_remote
name: Remote Backup
version: "1.0.0"
category: observability
reports_to: operator
peers: [backup_local]
depends_on: []

purpose: Live daily Tier 2 offsite backup to Backblaze B2 — dumps PostgreSQL, snapshots Qdrant, exports n8n, runs restic retention, and publishes the DR restore script.
inputs:
  - PostgreSQL databases
  - Qdrant collections
  - n8n workflows
  - Docker volume and system metadata
  - filesystem paths
outputs:
  - Backblaze B2 restic snapshots
  - Independently downloadable DR restore script
capabilities:
  - restic_backup
  - postgres_dump
  - qdrant_snapshot
  - b2_upload
schedule:
  type: timer
  systemd_unit: hapax-backup-remote.timer
  interval: daily
model: null

autonomy: full
decision_scope: Execute the daily offsite backup, apply the declared restic retention policy, and publish the recovery script. Cannot modify source data.
escalation_target: operator
axiom_bindings:
  - axiom_id: executive_function
    implications: [ex-routine-007]
    role: subject
  - axiom_id: corporate_boundary
    implications: [cb-key-001]
    role: subject
raci:
  - task: backup
    role: responsible

health_group: null
service_tier: 1

timer_display:
  schedule_label: "Daily 03:30"
  purpose: "B2 restic backup (Postgres + Qdrant + n8n + files + DR script)"

narrative: |
  The Remote Backup agent is a live daily Tier 2 lane by operator decision on
  2026-09-02. It independently dumps PostgreSQL, snapshots every Qdrant
  collection, exports n8n workflows, captures system and repository recovery
  metadata, writes a restic snapshot to Backblaze B2, applies the declared
  retention policy, and uploads the standalone DR restore script. It does not
  consume the local lane's staged dumps, so it has no runtime dependency on
  `backup_local`; the two lanes are independent failure domains.

review_repairs:
- Governing native/domain prose, binding configuration and installer keep existing governance protections; ordinary
  docs excluded.
- Governance lenses and T1 review include instructions; assertion and drift readers follow authored sources once.
- Rotation and canonical monthly staging include extracted policy prose.
- Deployed lifecycle observer uses isolated Python and an absolute source path; unique output alias retains predecessor
  evidence.
- Pending transactions permit guarded recovery of failed first installs, upgrades and partial rollback; foreign
  edits/successors refused; symlink retry tested.
- Explicit --check detects filesystem and receipt drift without writes; native loading remains unobserved.
- The observer resolves through the existing governed source-activation root by default; installed-copy tests cover
  stale primary/child trees, absent overrides and remote transport.
- A zero-exit old producer without a fresh receipt is diagnosed; prior receipts are preserved and never treated
  as new observation.
- Failed deployments retain their exact staged recovery executable in durable private instruction state; the wrapper
  recovery command is executed in a fault-injected test.
- Identical verified same-revision retries preserve original payloads, receipt and rollback boundary; pending or
  changed installations do not take the fast path.
- Native load-set receipts retain resolved roots, actual paths, declaration source refs and a declaration digest.
- Launch-time process-group ownership reaches native children behind npm wrappers, including after leader exit;
  cancellation is deferred across fork/identity recording. Real-process tests preserve a peer and reject PID-file
  signaling authority.
- Group escalation retains Bash wait-status ambiguity and never promotes local SSH teardown to remote-native termination.
  Detached descendants and uninterruptible kernel waits remain explicit limits.
- Empty and whitespace-only Codex overrides consistently permit verified identical retry; dangling overrides require
  reconciliation. Repeated retry retains the original rollback receipt.
- Collision errors identify both native bindings and resolved destinations with a next action; runbook includes
  native-load/lifecycle and alias/blob-reader rechecks.
- Registry digest freshness was already covered by an authored-payload test; an applied stale-digest mutation verifies
  rejection.
- Automatic rollback uses the same guarded pending-transaction recovery as the CLI; unknown intervening file, symlink
  or directory edits retain pending state and preimages. The lock serializes participating installers, not arbitrary
  external writers.
- Installed capability-receipt scripts import from governed activation and observe its selected project; source-checkout
  imports do not substitute a checkout as the deployed project. Default, empty, override, missing and isolated-import
  cases pass.
- Unsupported native TOML preservation errors identify the file, supported table form and next action. Existing
  and dangling output aliases preserve their prior targets when the fresh stream is published.
- Vibe launch and standup preserve authored instruction bytes and metadata and leave absent files absent; existing
  regression assertions now match this behavior.
- Native resume reports success only for one observed matching session; absent or mixed identity stays unobserved,
  and a single differing identity is a mismatch. Both native mappings are exercised.
- Resolved paths with conflicting digest expectations are rejected regardless of declaration order, including aliases
  and unknown digests; identical expectations may share a witness.
- Invalid original Grok TOML reports its path and a syntax-repair action before publication, separately from unsupported
  valid layouts.
